name: GridNova build verification

on:
  push:
    branches:
      - feature/cell-grid-engine-qa
  pull_request:
    branches:
      - feature/cell-grid-engine-qa

permissions:
  contents: read

concurrency:
  group: gridnova-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build application
        run: npm run build
